<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>
<style>
  body{
    background-image: url(bisasoBack.jpg);
    background-size:cover;
    background-repeat: no-repeat;
    font-family: Arial, Helvetica, sans-serif;
    
  }
  button{
    width:45px;
    height: 45px;
    border:none;
    border-radius:50%;
    margin:2px;
    background-color:tomato;
    color:black;
    font-weight:bold;
    box-shadow:3px 2px 2px greenyellow;
  }
  
  .renderEqn{
    color:green;
    font-weight:bold;
    font-size:27px;
    background-color:lightyellow;
    height: 75px;
    max-height:85px;
    max-width:100%;
    width:100%;
    border-radius:2px;
    overflow: auto;
    margin-bottom:15px;
  }
  
  .fullCalc{
    margin-left:5px;
    margin-top:0px;
  }
  
  .operate{
    background-color:black;
    color:red;
    font-size:25px;
    font-weight:bold;
  }
  
  .other{
    background-color: red;
    color:white;
    font-weight:400;
  }
  .toolCal{
    border:5px solid maroon;
    width:240px;
    padding:0px;
    border-radius: 12px 12px;
     margin-left:40px;
    height:360px;
    box-shadow: inset 5px 48px 5px black;
    
  }
  .cas{
    color:mediumblue;
    font-size:15px;
  }
</style>

<body>
  <div class="toolCal"> <h2 class="cas">Casio <em>STUART</em></h2>
  <div class="fullCalc">
  <div class="renderEqn">
    
  </div>
  
<div>
  <button onclick="calculation(1)">1</button>
    <button onclick="calculation(2)">2</button>
      <button  onclick="calculation(3)">3</button>
        <button class="operate" onclick="calculation('-')">-</button>
       
</div>
<div>
  <button  onclick="calculation(4)">4</button>
    <button onclick="calculation(5)">5</button>
      <button  onclick="calculation(6)">6</button>
        <button class="operate" onclick="calculation('+')">+</button>
        
</div>
<div>
  <button onclick="calculation(7)">7</button>
    <button onclick="calculation(8)">8</button>
      <button  onclick="calculation(9)">9</button>
        <button class="operate" onclick="calculation('/')">÷</button>
</div>

<div>
  <button class="other" onclick="
let answer= eval(equation)
equation = answer;
 display.innerHTML = `${equation} <br> ➡️`

  ">=</button>
    <button  onclick="calculation(0)">0</button>
      <button class="other" onclick="
      equation = ''
       display.innerHTML = equation
      ">clear</button>
      <button class="operate" onclick="calculation('*')">×</button>
</div>
</div>
</div>
<script>
const display = document.querySelector('.renderEqn')
  
  let equation = '';
  
  function calculation (value) {
    equation= equation+value;
    display.innerHTML=equation;  
  }
  
  
  
  
  
  
</script>
</body>

</html>
